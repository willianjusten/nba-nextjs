name: PR CI

on:
  pull_request:
    branches: [main, feat/update-ui-api]

jobs:
  ci:
    name: Lint, Type-check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint (OXC)
        run: npm run lint

      - name: Run type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test
